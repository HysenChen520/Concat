format = 2

[effect]
id = "concat.fresh"
name = "清新"
kind = "filter"
category = "日常"
order = 10
intensity = "pop"
description = "日光素材更出彩：中间调提亮，偏灰处补足色彩，最亮的白里带一丝薄荷，皮肤不动。"

[[param]]
key = "pop"
label = "通透度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "brightness"
label = "亮度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
