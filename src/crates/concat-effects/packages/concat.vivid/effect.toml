format = 2

[effect]
id = "concat.vivid"
name = "鲜艳"
kind = "filter"
category = "日常"
order = 11
intensity = "colour"
description = "色彩鲜亮、对比锐利，带一点边缘感：看起来像更好相机拍出的画面。皮肤在提升中被保留。"

[[param]]
key = "colour"
label = "颜色"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "冲击"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
