format = 2

[effect]
id = "concat.golden-hour"
name = "黄金时刻"
kind = "filter"
category = "日常"
order = 14
intensity = "glow"
description = "傍晚光线：保持亮度的暖色平衡，高光偏橙，阴影一丝品红，黑位略提。"

[[param]]
key = "glow"
label = "光晕"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "暖度"
min = 3500
max = 6500
default = 4600
step = 50
unit = "K"

[wgsl]
entry = "effect.wgsl"
space = "display"
