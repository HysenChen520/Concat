[effect]
id = "concat.lofi"
name = "Lo-fi 低保真"
kind = "audio"
category = "音色"
order = 25
intensity = "bits"
description = "老旧小音箱：没有高频，声音带颗粒感。"

[[param]]
key = "bits"
label = "比特"
min = 4
max = 12
default = 8
step = 1

[ffmpeg]
chain = "lowpass=f=3200,acrusher=bits={round(bits)}:mode=log:mix=0.8,alimiter=limit=0.9"
