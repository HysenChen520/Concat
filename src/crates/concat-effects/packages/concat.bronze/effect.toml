format = 2

[effect]
id = "concat.bronze"
name = "古铜"
kind = "filter"
category = "复古"
order = 42
intensity = "tone"
description = "保留对比与高光的棕褐色，呈现老胶片而非一片泛黄。"

[[param]]
key = "tone"
label = "色调"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
