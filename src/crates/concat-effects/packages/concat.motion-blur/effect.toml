format = 2

[effect]
id = "concat.motion-blur"
name = "动态模糊"
kind = "effect"
category = "模糊"
order = 22
version = 2
intensity = "length"
aliases = ["motion-blur"]
description = "沿一条方向拉出拖影，如同摇摄镜头。"

[[param]]
key = "length"
label = "长度"
min = 2
max = 60
default = 18
step = 1
unit = "px"

[[param]]
key = "angle"
label = "角度"
min = -90
max = 90
default = 0
step = 1
unit = "°"

[wgsl]
entry = "effect.wgsl"

# A coarse Gaussian along the line, then straight lines drawn between its
# samples.
[[wgsl.pass]]
target = "coarse"
