[effect]
id = "concat.telephone"
name = "电话音"
kind = "audio"
category = "音色"
order = 22
intensity = "drive"
aliases = ["telephone"]
description = "电话线路的窄频段。"

[[param]]
key = "drive"
label = "失真度"
min = 0
max = 10
default = 3
step = 0.5

[ffmpeg]
chain = "highpass=f=400,lowpass=f=3400,equalizer=f=1600:t=q:w=1.4:g={fixed(3 + drive / 2, 2)},alimiter=limit=0.92"
