format = 2

[effect]
id = "concat.walnut"
name = "胡桃棕"
kind = "filter"
category = "日常"
order = 19
intensity = "warmth"
description = "咖啡馆质感：中间调暖棕，绿色收敛为橄榄，对比缓和。温馨，对木质与皮肤都友好。"

[[param]]
key = "warmth"
label = "暖度"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "soften"
label = "柔化"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
