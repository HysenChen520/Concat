format = 2

[effect]
id = "concat.point-and-shoot"
name = "傻瓜相机"
kind = "filter"
category = "复古"
order = 45
intensity = "flash"
description = "两千年代卡片机：硬闪、过曝白、色彩偏高、冷青偏色，过度锐化并带传感器噪点。"

[[param]]
key = "flash"
label = "闪光"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "noise"
label = "噪点"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
