format = 2

[effect]
id = "concat.cloudless-sky"
name = "晴空"
kind = "filter"
category = "日常"
order = 15
intensity = "sky"
description = "天空更深更蓝，植被更冷更静，画面其余部分与每张脸保持不动。旅行素材适用。"

[[param]]
key = "sky"
label = "天空"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "greens"
label = "绿色"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"

# The reference picture has no sky; the card pushes both bands so the
# blue wall and the green jumper show the look.
[card]
params = { sky = 100, greens = 100 }
