format = 2

[effect]
id = "concat.slide"
name = "滑动"
kind = "transition"
category = "滑动"
order = 4
description = "下一镜头滑入覆盖上一镜头并落定，在所覆盖镜头上投下柔影。"

[[param]]
key = "direction"
label = "方向"
type = "enum"
values = [0, 1, 2, 3]
labels = ["左", "右", "上", "下"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
