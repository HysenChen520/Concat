format = 2

[effect]
id = "concat.teal-orange"
name = "青橙色调"
kind = "filter"
category = "电影感"
order = 30
intensity = "amount"
description = "阴影青绿，高光橙，皮肤保持肤色，上层覆一条胶片曲线。大片调色，最受欢迎的色调。"

[[param]]
key = "amount"
label = "强度"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "skin"
label = "肤色保护"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
