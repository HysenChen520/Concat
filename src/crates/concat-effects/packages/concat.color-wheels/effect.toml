format = 2

[effect]
id = "concat.color-wheels"
name = "色轮"
kind = "effect"
category = "色彩"
order = 14
description = "阴影、中间调、高光的提升、Gamma 与增益：各自推向某一色相并调亮或压暗。"

[[param]]
key = "lift"
group = "色轮"
label = "提升"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gamma"
group = "色轮"
label = "伽马"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[[param]]
key = "gain"
group = "色轮"
label = "增益"
type = "wheel"
min = -1
max = 1
default = 0
step = 0.01
animate = true

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a teal shadow and a warm
# highlight.
[card]
params = { "lift.x" = 0.0, "lift.y" = -0.6, "gain.x" = 0.35, "gain.y" = 0.45 }
