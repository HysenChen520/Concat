format = 2

[effect]
id = "concat.mono"
name = "单色"
kind = "filter"
category = "复古"
order = 43
intensity = "contrast"
description = "彩色滤镜下的黑白：红色压暗天空、提亮皮肤，绿色相反。可按需加一点颗粒。"

[[param]]
key = "colour"
label = "滤色"
min = -100
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "grain"
label = "颗粒"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
