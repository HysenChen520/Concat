[effect]
id = "concat.megaphone"
name = "扩音器"
kind = "audio"
category = "人声"
order = 15
intensity = "drive"
aliases = ["bullhorn", "loudspeaker"]
description = "手持扩音器般刺耳、聚焦中频的喊话声。"

[[param]]
key = "drive"
label = "失真度"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "highpass=f=550,lowpass=f=2800,equalizer=f=1600:t=q:w=2.0:g={fixed(3 + drive * 0.8, 2)},alimiter=limit=0.88"
