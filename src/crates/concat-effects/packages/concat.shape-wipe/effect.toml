format = 2

[effect]
id = "concat.shape-wipe"
name = "形状擦除"
kind = "transition"
category = "擦除"
order = 12
description = "下一镜头从中心生长的圆形、心形或星形中显露，直至铺满画面。"

[[param]]
key = "shape"
label = "形状"
type = "enum"
values = [0, 1, 2]
labels = ["圆形", "心形", "星形"]
default = 0
min = 0
max = 2

[[param]]
key = "softness"
label = "柔化"
unit = "%"
min = 0
max = 100
step = 1
default = 15

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"

[card]
progress = 0.55
