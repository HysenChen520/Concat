format = 2

[effect]
id = "concat.aquamarine"
name = "海蓝宝"
kind = "filter"
category = "日常"
order = 16
intensity = "water"
description = "水与天空转为明亮的海蓝宝石色，沙滩与皮肤保持温暖干净。创作者拍海滩首选的色调。"

[[param]]
key = "water"
label = "水色"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "brightness"
label = "亮度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
