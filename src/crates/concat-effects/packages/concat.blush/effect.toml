category = "人像"
order = 20
intensity = "glow"
description = "皮肤偏桃色并柔化，阴影提亮让纹路缓和，对比偏低。适合人像与口播，建议以半强度运行。"

[[param]]
key = "glow"
label = "光晕"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "softness"
label = "柔化"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
