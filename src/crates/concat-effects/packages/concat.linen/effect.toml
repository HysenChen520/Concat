format = 2

[effect]
id = "concat.linen"
name = "亚麻暖色"
kind = "filter"
category = "日常"
order = 18
intensity = "matte"
description = "Whitewash 的暖色姊妹款：同样柔和哑光，白里带奶油色，中间调一丝金。室内与晨光适用。"

[[param]]
key = "matte"
label = "哑光"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "暖度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
