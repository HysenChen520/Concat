[effect]
id = "concat.distorted"
name = "失真"
kind = "audio"
category = "音色"
order = 26
intensity = "drive"
description = "强推并削波失真。"

[[param]]
key = "drive"
label = "失真度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "volume={fixed(1 + drive / 100 * 7, 2)},acrusher=bits=6:mode=lin:mix={fixed(drive / 100 * 0.7, 2)},alimiter=limit=0.85:level=false"
