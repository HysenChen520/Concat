format = 2

[effect]
id = "concat.white-balance"
name = "白平衡"
kind = "effect"
category = "色彩"
order = 13
intensity = "temperature"
description = "仿佛被更暖或更冷的光照亮，并偏向品红或绿，如同眼睛适应光线后的观感。"

[[param]]
key = "temperature"
label = "色温"
min = 2000
max = 11000
default = 6500
step = 50
unit = "K"
animate = true

[[param]]
key = "tint"
label = "色调"
min = -100
max = 100
default = 0
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"

# At its defaults the picture is as shot; the card shows a warm light.
[card]
params = { temperature = 4500 }
