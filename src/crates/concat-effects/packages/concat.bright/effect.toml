[effect]
id = "concat.bright"
name = "明亮"
kind = "audio"
category = "音色"
order = 22
intensity = "gain"
aliases = ["bright"]
description = "空气感与临场感：抬升六千赫兹以上。"

[[param]]
key = "gain"
label = "增益"
min = 0
max = 12
default = 5
step = 0.5
unit = "dB"

[ffmpeg]
chain = "treble=g={fixed(gain, 2)}:f=6000:w=0.8,alimiter=limit=0.95"
