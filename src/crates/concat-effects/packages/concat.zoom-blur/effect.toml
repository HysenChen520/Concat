format = 2

[effect]
id = "concat.zoom-blur"
name = "径向模糊"
kind = "effect"
category = "模糊"
order = 23
intensity = "amount"
description = "朝一点急速推进，如同拍摄中镜头变焦。"

[[param]]
key = "amount"
label = "强度"
min = 0
max = 100
default = 25
step = 1
unit = "%"
animate = true

[[param]]
key = "x"
label = "中心 X"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "y"
label = "中心 Y"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# Sixteen scales a pass, each pass filling in between two of the next
# one's: four thousand and ninety-six along each streak.
[[wgsl.pass]]
target = "fine"

[[wgsl.pass]]
target = "middle"
