format = 2

[effect]
id = "concat.push"
name = "推移"
kind = "transition"
category = "滑动"
order = 5
aliases = ["push"]
description = "下一镜头把上一镜头推出画面，两者整体移动，全速处带运动模糊拖影。"

[[param]]
key = "direction"
label = "方向"
type = "enum"
values = [0, 1, 2, 3]
labels = ["左", "右", "上", "下"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
