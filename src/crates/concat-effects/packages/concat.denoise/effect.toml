[effect]
id = "concat.denoise"
name = "降噪"
kind = "audio"
category = "修复"
order = 41
intensity = "strength"
description = "去除人声下方的嗡鸣与嘶嘶声。"

[[param]]
key = "strength"
label = "强度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "afftdn=nf={fixed(0 - 20 - strength / 100 * 30, 1)}:nr={fixed(6 + strength / 100 * 30, 1)}"
