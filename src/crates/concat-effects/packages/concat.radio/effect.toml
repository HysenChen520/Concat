[effect]
id = "concat.radio"
name = "收音机"
kind = "audio"
category = "音色"
order = 24
intensity = "noise"
aliases = ["radio"]
description = "长波小音箱：频段窄，略带碎裂感。"

[[param]]
key = "noise"
label = "噪点"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[ffmpeg]
let = [
  "bits = 16 - (noise / 100) * 12",
]
chain = "highpass=f=300,lowpass=f=3400,acrusher=bits={round(bits)}:mode=log:mix=0.6,alimiter=limit=0.9"
