[effect]
id = "concat.underwater"
name = "水下"
kind = "audio"
category = "空间"
order = 34
intensity = "depth"
aliases = ["submerged"]
description = "沉入水面之下，经重度低通滤波。"

[[param]]
key = "depth"
label = "深度"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowpass=f={fixed(800 - depth * 40, 1)},equalizer=f=200:t=q:w=2.0:g={fixed(2 + depth * 0.3, 2)},alimiter=limit=0.92"
