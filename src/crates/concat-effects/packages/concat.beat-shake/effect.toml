format = 2

[effect]
id = "concat.beat-shake"
name = "节拍抖动"
kind = "effect"
category = "抖动"
order = 6
intensity = "amount"
description = "按你设定的节拍每拍震一下，每次晃动方向不同，从片段或图层开始时起作用。"

[[param]]
key = "bpm"
label = "速度"
unit = "BPM"
min = 40
max = 240
step = 1
default = 120

[[param]]
key = "amount"
label = "强度"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[[param]]
key = "length"
label = "打击长度"
unit = "%"
min = 10
max = 100
step = 1
default = 60

[[param]]
key = "punch"
label = "缩放冲击"
unit = "%"
min = 0
max = 100
step = 1
default = 30

[[param]]
key = "blur"
label = "动态模糊"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.04
