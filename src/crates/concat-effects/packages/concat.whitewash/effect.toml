format = 2

[effect]
id = "concat.whitewash"
name = "漂白柔雾"
kind = "filter"
category = "日常"
order = 17
intensity = "matte"
description = "明亮哑光：白色柔而冷，黑位明显抬离底部，色彩安静。白房间式干净极简质感。"

[[param]]
key = "matte"
label = "哑光"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "cool"
label = "冷色"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
