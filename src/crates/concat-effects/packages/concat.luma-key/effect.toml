format = 2

[effect]
id = "concat.luma-key"
name = "亮度抠像"
kind = "effect"
category = "抠像"
order = 59
intensity = "threshold"
description = "抠除画面暗部——黑底拍摄的火焰、烟雾或火花——或反转后抠除亮部。"

[[param]]
key = "threshold"
label = "阈值"
min = 0
max = 100
default = 10
step = 1
unit = "%"

[[param]]
key = "softness"
label = "柔化"
min = 0
max = 50
default = 10
step = 1
unit = "%"

[[param]]
key = "invert"
label = "反相"
type = "bool"
min = 0
max = 1
default = 0
step = 1

[wgsl]
entry = "effect.wgsl"
space = "display"

# The still's shadows taken out, for the card.
[card]
params = { threshold = 35 }
