format = 2

[effect]
id = "concat.saturation"
name = "饱和度"
kind = "effect"
category = "色彩"
order = 12
intensity = "amount"
description = "在每个像素自身亮度基础上，色彩更浓或更灰。"

[[param]]
key = "amount"
label = "饱和度"
min = -100
max = 100
default = 0
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"
space = "display"

# At its default the picture is as shot; the card shows a push.
[card]
params = { amount = 50 }
