[effect]
id = "concat.treble"
name = "高音"
kind = "audio"
category = "音色"
order = 21
intensity = "gain"
aliases = ["treble"]
description = "更多高频透亮感。"

[[param]]
key = "gain"
label = "增益"
min = 0
max = 12
default = 4
step = 0.5
unit = "dB"

[ffmpeg]
chain = "treble=g={fixed(gain, 2)}:f=9000:w=0.7,alimiter=limit=0.95"
