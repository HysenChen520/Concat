format = 2

[effect]
id = "concat.curves"
name = "曲线"
kind = "effect"
category = "色彩"
order = 15
description = "沿你绘制的曲线调整画面电平：亮度曲线只控明度，再分别调红、绿、蓝。"

[[param]]
key = "luma"
group = "曲线"
label = "亮度"
type = "curve"

[[param]]
key = "red"
group = "曲线"
label = "红"
type = "curve"

[[param]]
key = "green"
group = "曲线"
label = "绿"
type = "curve"

[[param]]
key = "blue"
group = "曲线"
label = "蓝"
type = "curve"

[wgsl]
entry = "effect.wgsl"
space = "display"

# At rest the picture is as shot; the card shows a gentle S.
[card]
params = { "luma.0.x" = 0.0, "luma.0.y" = 0.0, "luma.1.x" = 0.25, "luma.1.y" = 0.18, "luma.2.x" = 0.75, "luma.2.y" = 0.84, "luma.3.x" = 1.0, "luma.3.y" = 1.0 }
