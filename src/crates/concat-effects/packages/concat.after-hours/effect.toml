format = 2

[effect]
id = "concat.after-hours"
name = "午夜时分"
kind = "filter"
category = "电影感"
order = 37
intensity = "depth"
description = "深黑，除灯光外整体偏冷，饱和度低，略带颗粒。适合深夜桌面与独白镜头。"

[[param]]
key = "depth"
label = "深度"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "grain"
label = "颗粒"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
