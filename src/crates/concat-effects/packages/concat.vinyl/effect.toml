[effect]
id = "concat.vinyl"
name = "黑胶唱片"
kind = "audio"
category = "音色"
order = 24
intensity = "warmth"
aliases = ["record", "gramophone"]
description = "温暖的复古唱片机质感，频带受限。"

[[param]]
key = "warmth"
label = "暖度"
min = 0
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "highpass=f=250,lowpass=f=5000,equalizer=f=1200:t=q:w=1.5:g={fixed(2 + warmth * 0.4, 2)},alimiter=limit=0.95"
