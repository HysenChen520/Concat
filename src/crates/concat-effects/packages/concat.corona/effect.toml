format = 2

[effect]
id = "concat.corona"
name = "日冕光晕"
version = 1
kind = "effect"
category = "胶片"
order = 151
intensity = "amount"
aliases = ["corona"]
description = "由金色螺旋模糊从画面过曝高光中聚出的冷蓝白光晕——纯程序生成，并非素材光晕的移植。"

[[param]]
key = "threshold"
label = "阈值"
min = 20
max = 95
default = 60
step = 1
unit = "%"

[[param]]
key = "radius"
label = "半径"
min = 4
max = 60
default = 18
step = 1
unit = "%"

[[param]]
key = "amount"
label = "强度"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "cool"
label = "冷度"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# The corona is one blur pass, half the layer's pixels on each axis,
# read back by the final pass.
[[wgsl.pass]]
target = "bloom"
shrink = ["2", "2"]

[card]
params = { threshold = 45, amount = 80 }
