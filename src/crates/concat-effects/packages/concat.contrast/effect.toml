format = 2

[effect]
id = "concat.contrast"
name = "对比度"
kind = "effect"
category = "色彩"
order = 11
intensity = "amount"
description = "以中灰为基准增减对比（档），保住过白高光，黑位不压死。"

[[param]]
key = "amount"
label = "对比度"
min = -100
max = 100
default = 0
step = 1
unit = "%"
animate = true

[wgsl]
entry = "effect.wgsl"

# At its default the picture is as shot; the card shows a push.
[card]
params = { amount = 40 }
