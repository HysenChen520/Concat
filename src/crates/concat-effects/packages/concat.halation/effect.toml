format = 2

[effect]
id = "concat.halation"
name = "泛光晕染"
version = 3
kind = "effect"
category = "胶片"
order = 150
intensity = "amount"
aliases = ["halation"]
description = "胶片在过曝高光周围留下的红橙光晕——光线穿过乳剂、从片基散射回来形成。"

[[param]]
key = "threshold"
label = "阈值"
min = 20
max = 95
default = 55
step = 1
unit = "%"

[[param]]
key = "radius"
label = "半径"
min = 4
max = 60
default = 22
step = 1
unit = "%"

[[param]]
key = "amount"
label = "强度"
min = 0
max = 100
default = 45
step = 1
unit = "%"

[[param]]
key = "tint"
label = "色调"
min = -100
max = 100
default = 0
step = 1
unit = "%"
# A parameter carries no description field of its own (Param has no such
# key, and the manifest denies unknown fields): negative is the deep red of
# a dense negative, positive the orange of a print, zero the red-orange of
# the stock.

[wgsl]
entry = "effect.wgsl"

# The halo is the bright light, taken at a quarter of the layer's pixels,
# blurred across and then down by one Gaussian. Every pass is a quarter
# both ways, so the blur is round and its cost held (see effect.wgsl).
[[wgsl.pass]]
target = "light"
shrink = ["4", "4"]

[[wgsl.pass]]
target = "across"
shrink = ["4", "4"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]

[card]
params = { threshold = 38, amount = 75 }