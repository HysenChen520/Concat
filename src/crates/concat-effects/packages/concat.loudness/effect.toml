[effect]
id = "concat.loudness"
name = "响度归一化"
kind = "audio"
category = "修复"
order = 40
intensity = "target"
description = "把整段素材拉到统一响度，符合广播与平台的要求。"

[[param]]
key = "target"
label = "目标响度"
min = -30
max = -12
default = -23
step = 1
unit = "dB"

[ffmpeg]
chain = "loudnorm=I={fixed(target, 1)}:TP=-1.5:LRA=11"
