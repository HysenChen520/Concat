format = 2

[effect]
id = "concat.exposure"
name = "曝光"
kind = "effect"
category = "色彩"
order = 10
intensity = "stops"
description = "按曝光档调亮或调暗，如同镜头所致，保住高光。"

[[param]]
key = "stops"
label = "曝光"
min = -4
max = 4
default = 0
step = 0.05
unit = "EV"
animate = true

[wgsl]
entry = "effect.wgsl"

# At its default the picture is as shot; the card shows a stop up.
[card]
params = { stops = 1 }
