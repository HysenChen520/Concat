format = 2

[effect]
id = "concat.instant-print"
name = "拍立得"
kind = "filter"
category = "复古"
order = 41
intensity = "fade"
description = "一次成像照片：奶油色哑光，高光偏暖，阴影渗入青色，四角略柔。"

[[param]]
key = "fade"
label = "衰减"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "暖度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
