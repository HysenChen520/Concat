format = 2

[effect]
id = "concat.light-leak-flash"
name = "闪白漏光"
kind = "transition"
category = "光效"
order = 16
description = "有机的过曝胶片漏光闪光，衔接剪切点。"

[[param]]
key = "strength"
label = "强度"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "fadewhite"
fallback = "cross-fade"

# By the usual point of the cut the flash has burned the frame white.
[card]
progress = 0.15
