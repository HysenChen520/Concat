format = 2

[effect]
id = "concat.vhs"
name = "VHS 录像"
kind = "filter"
category = "复古"
order = 44
intensity = "bleed"
description = "色彩横向溢出、扫描线、柔化、磁带噪点与过饱和，磁头磨损带来轻微纵向拖影。"

[[param]]
key = "bleed"
label = "渗色"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "lines"
label = "扫描线"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
