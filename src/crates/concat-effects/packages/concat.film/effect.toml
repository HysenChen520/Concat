format = 2

[effect]
id = "concat.film"
name = "胶片"
kind = "filter"
category = "电影感"
order = 34
intensity = "grain"
description = "带真实趾部与肩部的胶片曲线，灯光周围暖色光晕，颗粒在流动。是印片质感，而非普通滤镜。"

[[param]]
key = "grain"
label = "颗粒"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "暖度"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
