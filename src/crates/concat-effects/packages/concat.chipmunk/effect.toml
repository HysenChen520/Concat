[effect]
id = "concat.chipmunk"
name = "花栗鼠高音"
kind = "audio"
category = "人声"
order = 12
intensity = "pitch"
aliases = ["chipmunk"]
description = "更高、更尖。"

[[param]]
key = "pitch"
label = "音调"
min = 3
max = 12
default = 7
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},highpass=f=120,alimiter=limit=0.94"
