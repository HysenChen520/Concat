format = 2

[effect]
id = "concat.linear-wipe"
name = "线性擦除"
kind = "transition"
category = "擦除"
order = 10
aliases = ["wipe-left", "wipe-right"]
description = "一条直线划过画面，将下一镜头留在身后。"

[[param]]
key = "direction"
label = "方向"
type = "enum"
values = [0, 1, 2, 3]
labels = ["从左到右", "从右到左", "从上到下", "从下到上"]
default = 0
min = 0
max = 3

[[param]]
key = "softness"
label = "柔化"
unit = "%"
min = 0
max = 100
step = 1
default = 20

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
