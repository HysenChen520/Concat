[effect]
id = "concat.bass"
name = "低音"
kind = "audio"
category = "音色"
order = 20
intensity = "gain"
aliases = ["bass"]
description = "增强低频。"

[[param]]
key = "gain"
label = "增益"
min = 0
max = 12
default = 5
step = 0.5
unit = "dB"

[ffmpeg]
chain = "bass=g={fixed(gain, 2)}:f=110:w=0.6,alimiter=limit=0.95"
