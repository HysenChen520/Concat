format = 2

[effect]
id = "concat.vibrance"
name = "自然饱和度"
kind = "filter"
category = "色彩"
order = 32
# 2: the parameter is `amount`; a project that stored `intensity` for it
# takes the default.
version = 2
intensity = "amount"
aliases = ["vibrance"]
description = "偏灰处色彩更浓，已饱和的部分不过曝。"

[[param]]
key = "amount"
label = "强度"
min = 0.1
max = 2
default = 0.7
step = 0.05

[wgsl]
entry = "effect.wgsl"
space = "display"
