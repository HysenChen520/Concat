format = 2

[effect]
id = "concat.city-lights"
name = "城市霓虹"
kind = "filter"
category = "风格化"
order = 52
intensity = "lights"
description = "夜景都市：灯光招牌鲜艳发光，黑位深而冷，人脸保持干净。为商业街而做。"

[[param]]
key = "lights"
label = "灯光"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "depth"
label = "深度"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
