[effect]
id = "concat.stadium"
name = "体育场"
kind = "audio"
category = "空间"
order = 35
intensity = "size"
aliases = ["arena"]
description = "巨型场馆内辽阔的体育场回声与混响。"

[[param]]
key = "size"
label = "大小"
min = 1
max = 10
default = 6
step = 0.5

[ffmpeg]
chain = "aecho=0.8:0.88:{round(120 + size * 18)}|{round(240 + size * 36)}:0.45|0.28,lowpass=f=6500"
