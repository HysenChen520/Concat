[effect]
id = "concat.cathedral"
name = "教堂混响"
kind = "audio"
category = "空间"
order = 34
intensity = "size"
aliases = ["cathedral"]
description = "石质空间与高度感：延迟片刻才到达的回声。"

[[param]]
key = "size"
label = "大小"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(120 * scale)}|{round(230 * scale)}|{round(390 * scale)}|{round(600 * scale)}:0.6|0.5|0.4|0.3"
