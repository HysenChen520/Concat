format = 2

[effect]
id = "concat.glow"
name = "辉光"
kind = "effect"
category = "风格化"
shelves = ["Featured", "Light & Shadow"]
order = 42
version = 2
intensity = "amount"
aliases = ["glow"]
description = "画面明亮部分周围的柔和光晕。"

[[param]]
key = "amount"
label = "强度"
min = 10
max = 100
default = 45
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"

# The glow is a wide Gaussian, drawn across and then down at a quarter of
# the layer's pixels, four of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]
