format = 2

[effect]
id = "concat.cool-blue"
name = "冷蓝"
kind = "filter"
category = "电影感"
order = 32
intensity = "chill"
description = "阴影与中间调偏蓝，高光与皮肤保持中性，对比提升。黄昏城市适用。"

[[param]]
key = "chill"
label = "冷度"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "对比度"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
