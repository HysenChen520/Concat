format = 2

[effect]
id = "concat.zoom-transition"
name = "缩放"
kind = "transition"
category = "缩放"
order = 3
aliases = ["zoom"]
description = "镜头一次不间断推进：冲入上一镜头再穿出进入下一镜头，被速度拉出条纹。"

[[param]]
key = "direction"
label = "方向"
type = "enum"
values = [0, 1]
labels = ["推入", "拉出"]
default = 0
min = 0
max = 1

[transition]
fallback = "cross-fade"
xfade = "zoomin"
entry = "effect.wgsl"
